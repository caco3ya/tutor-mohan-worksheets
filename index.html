.chips{display:flex;flex-wrap:wrap;gap:7px}
.grp{width:100%;font-size:10.5px;color:#a1a1aa;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.cnt{border-radius:14px;padding:12px 10px;border:1px solid #ece7de;background:#fdfcfb;position:relative}
.cnt b{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.cnt.e b{color:#15803d}.cnt.m b{color:#b45309}.cnt.d b{color:#b91c1c}
.cnt small{display:block;color:#71717a;font-size:11px;margin-top:4px}
.status{margin-top:12px;font-size:12px;padding:10px 12px;border-radius:10px;line-height:1.45}
.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:#18181b;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.go:disabled{opacity:.35;cursor:not-allowed}
.go:hover:not(:disabled){opacity:.9;transform:translateY(-1px);box-shadow:0 8px 24px #00000018}
.go.ai{background:linear-gradient(135deg,#18181b,#3f3f46);letter-spacing:.01em}
.sheet{width:210mm;min-height:0;height:auto;min-height:297mm;background:#fff;border:1px solid #ece7de;box-shadow:0 10px 40px #0000000e;margin:0 auto 24px;padding:11mm 13mm 8mm;display:flex;flex-direction:column;overflow:hidden;break-after:page}
.sheet .hd{text-align:center;border-bottom:1px solid #ece7de;padding-bottom:3mm}
.hd .t{font-family:'Instrument Serif', Georgia, serif;font-size:22px;line-height:1.2}
.hd .s{font-size:10.5px;color:#71717a;margin-top:2px;line-height:1.4}
.fields{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;margin-top:4mm;color:#52525b;flex-wrap:wrap}
.fields i{display:inline-block;border-bottom:1px dotted #71717a;min-width:34mm;font-style:normal}
.mh,.ft{display:flex;justify-content:space-between;font-size:8pt;color:#8a8a93}
.mh{border-bottom:1px solid #f0ebe3;padding-bottom:2mm}.ft{border-top:1px solid #f0ebe3;padding-top:2mm;margin-top:auto}
.body{margin-top:3mm;column-gap:9mm;column-rule:1px solid #f0ebe3}
.q{break-inside:avoid;padding:2.6mm 0;border-bottom:1px solid #f6f1e8;display:flex;gap:8px;font-size:11.5px;line-height:1.45}
.n{flex:none;width:19px;height:19px;border-radius:50%;background:#18181b;color:#fff;font-size:9px;display:grid;place-items:center;font-weight:600;margin-top:1px}
.qt{white-space:pre-line;font-weight:500}.o{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:5px;font-size:11px}
.ln{height:7mm;border-bottom:1px dotted #a1a1aa}
.ak{font-size:11px;padding:1.6mm 0;line-height:1.4;break-inside:avoid}
.ak.compact{font-size:8.5px;padding:1mm;border:1px solid #f0ebe3;border-radius:6px;margin:1px;background:#fdfcfb}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.spinner{width:12px;height:12px;border:2px solid #e7e5e4;border-top-color:#18181b;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.ai-box{border:1px solid #ece7de;background:linear-gradient(100deg,#fff 20%,#fdf6ee 40%,#fff 60%);background-size:200% 100%;animation:shimmer 1.6s infinite linear;border-radius:14px;padding:14px 16px;margin-top:14px;display:flex;gap:12px;align-items:center}
.ai-dot{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#e7e5e4);border:1px solid #ece7de;display:grid;place-items:center;font-size:18px;flex:none;animation:spin 2.8s linear infinite}
.ai-lines{flex:1;display:grid;gap:8px}
.ai-line{height:8px;border-radius:99px;background:#f4f1eb}
.ai-line.w60{width:60%}.ai-line.w40{width:40%}.ai-line.w80{width:80%}
.auto-badge{font-size:9px;letter-spacing:.08em;text-transform:uppercase;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;padding:3px 7px;border-radius:99px;font-weight:600}
.logo{cursor:pointer;user-select:none;-webkit-user-select:none}
.logo:active{transform:scale(.98)}
@media print{@page{size:A4;margin:0} .no-print{display:none!important} .sheet{margin:0;border:0;box-shadow:none}}
