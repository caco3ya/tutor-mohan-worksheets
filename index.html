function doGet(e){
  const action = (e.parameter.action||"").toLowerCase();
  const id = e.parameter.id || e.parameter.fileId || e.parameter.sheetId;
  try{
    if(action==="index" || action==="getindex" || !id){
      return jsonResponse(readIndex_());
    }
    if(action==="read" || action==="getquestions" || action==="readall"){
      const out = readQuestions_v15_(id);
      return jsonResponse(out);
    }
    return jsonResponse({ok:false, error:"unknown action"});
  }catch(err){
    return jsonResponse({ok:false, error:String(err), stack: err.stack||""});
  }
}
function jsonResponse(obj){
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}
function readIndex_(){
  const INDEX_ID = "1VxeTKAyHeIDlrjwbVJaOyZWkIj_G8BMTxohr-Rw0VnQ";
  const TAB = "DriveIndex";
  const ss = SpreadsheetApp.openById(INDEX_ID);
  const sh = ss.getSheetByName(TAB) || ss.getSheets()[0];
  const vals = sh.getDataRange().getDisplayValues();
  const headers = vals[0].map(h=>String(h).toLowerCase().replace(/\\s+/g,""));
  const out=[];
  for(let r=1;r<vals.length;r++){
    const row=vals[r];
    const get = (names)=>{ for(const n of names){ const i=headers.findIndex(h=>h.includes(n)); if(i>-1) return row[i]; } return ""; };
    const subject = get(["subject"]);
    const grade = get(["grade","class"]);
    const chapter = get(["chapter","unit"]);
    const topic = get(["topic","lesson"]);
    const fileId = get(["fileid","id"]);
    if(subject && topic && fileId) out.push({subject, grade, chapter, topic, fileId: String(fileId).trim()});
  }
  return out;
}
function extractImageFormula_(formula, displayValue){
  if(!formula && !displayValue) return {clean:"", imageUrl:null};
  const f = String(formula||"").trim();
  const dv = String(displayValue||"").trim();
  const src = f || dv;
  const m = src.match(/IMAGE\\s*\\(\\s*["']([^"']+)["']/i);
  if(m && m[1]){
    const url = m[1].trim();
    const clean = src.replace(/=IMAGE\\s*\\([^)]*\\)/gi,'').replace(/IMAGE\\s*\\([^)]*\\)/gi,'').trim();
    return {clean: clean===url ? "" : clean, imageUrl:url};
  }
  // bare drive url that is meant as image
  if(/^https?:\\/\\/\\S+$/.test(dv) && (dv.includes("drive.google.com") || /\\.(png|jpe?g|gif|webp)$/i.test(dv))){
    if(dv.split(/\\s+/).length===1) return {clean:"", imageUrl:dv};
  }
  return {clean: dv, imageUrl:null};

function normalizeDriveUrl_(url){
  if(!url) return url;

  const m2=s.match(/\\/file\\/d\\/([^/]+)/);
  const m3=s.match(/\\/d\\/([^/]+)\\//);

*{box-sizing:border-box}

.pill{font-size:12.5px;border:1px solid #ece7de;background:#fff;border-radius:99px;padding:7px 14px;cursor:pointer;transition:.15s;line-height:1;display:inline-flex;align-items:center;gap:6px}

.chips{display:flex;flex-wrap:wrap;gap:7px}

.cnt small{display:block;color:#71717a;font-size:11px;margin-top:4px}
.status{margin-top:12px;font-size:12px;padding:10px 12px;border-radius:10px;line-height:1.45}
.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:#18181b;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.go:disabled{opacity:.35;cursor:not-allowed}
.go:hover:not(:disabled){opacity:.9;transform:translateY(-1px);box-shadow:0 8px 24px #00000018}
.go.ai{background:linear-gradient(135deg,#18181b,#3f3f46);letter-spacing:.01em}

.sheet .hd{text-align:center;border-bottom:1px solid #ece7de;padding-bottom:3mm}
.hd .t{font-family:'Instrument Serif', Georgia, serif;font-size:22px;line-height:1.2}

.fields{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;margin-top:4mm;color:#52525b;flex-wrap:wrap}

.body{margin-top:3mm;column-gap:9mm;column-rule:1px solid #f0ebe3}

.q-img-wrap{margin-top:6px}
