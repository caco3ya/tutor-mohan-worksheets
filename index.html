*{box-sizing:border-box;font-family:Poppins,system-ui,sans-serif}
body{margin:0;background:#fdfcfb;color:#18181b;font-size:14px}
.serif{font-family:'Instrument Serif',serif}
header{position:sticky;top:0;z-index:5;background:#fdfcfbee;border-bottom:1px solid #f0ebe3;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(10px);gap:10px;flex-wrap:wrap}
header .serif{font-size:18px}
.chip{font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid #ece7de;background:#f4f0e8;display:inline-flex;align-items:center;gap:6px}
main{max-width:900px;margin:0 auto;padding:22px 14px 70px}
.card{background:#fff;border:1px solid #ece7de;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 8px 30px #00000008}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:32px;margin:0;text-align:center;letter-spacing:-0.02em}
.sub{text-align:center;font-size:12px;color:#71717a;margin:8px 0 18px;line-height:1.5}
label.l{display:block;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#71717a;font-weight:600;margin:18px 0 7px}
select,input[type=text],input[type=number]{width:100%;padding:10px 12px;border:1px solid #ece7de;border-radius:12px;background:#fdfcfb;font-size:14px;outline:none;transition:.15s}
select:focus,input:focus{border-color:#18181b;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.row,.row4{grid-template-columns:1fr 1fr} h1{font-size:26px}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}.chips input{display:none}
.chips span{display:inline-block;padding:6px 13px;border:1px solid #ece7de;border-radius:99px;font-size:12.5px;background:#fff;transition:.15s;line-height:1}
.chips input:checked+span{background:#18181b;color:#fff;border-color:#18181b}
.grp{font-size:10.5px;color:#a1a1aa;margin:12px 0 4px;width:100%;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.mini{font-size:11px;border:1px solid #ece7de;background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;transition:.15s}
.mini:hover{background:#18181b;color:#fff;border-color:#18181b}
.cnt{border-radius:14px;padding:10px;border:1px solid #ece7de;background:#fdfcfb}
.cnt b{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}.cnt small{display:block;color:#71717a;font-size:11px;margin-top:3px}
.e b{color:#15803d}.m b{color:#b45309}.d b{color:#b91c1c}
.status{margin-top:10px;font-size:12px;padding:9px 12px;border-radius:10px;line-height:1.45}
.ok{background:#ecfdf5;color:#065f46}.bad{background:#fef2f2;color:#991b1b}.warn{background:#fffbeb;color:#92400e}
.opts{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px}
.opts label{display:flex;gap:6px;align-items:center}.opts select{width:auto;padding:5px 10px}
.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#18181b;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;letter-spacing:.01em}
.go:hover{opacity:.88;transform:translateY(-1px)}
.go:disabled{opacity:.35;cursor:not-allowed;transform:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin:26px 0 14px}
.btn{padding:9px 16px;border-radius:99px;border:1px solid #ddd6c8;background:#fff;cursor:pointer;font-size:13px;transition:.15s}.btn:hover{background:#f4f0e8}
.btn.p{background:#18181b;color:#fff;border-color:#18181b}.btn.p:hover{opacity:.9}
.sheet{width:210mm;min-height:0;height:297mm;background:#fff;border:1px solid #ece7de;box-shadow:0 10px 40px #00000012;margin:0 auto 24px;padding:11mm 13mm 8mm;display:flex;flex-direction:column;overflow:hidden;break-after:page}
.sheet .hd{text-align:center;border-bottom:1px solid #ece7de;padding-bottom:3mm}
.hd .t{font-family:'Instrument Serif',serif;font-size:22px;line-height:1.2}.hd .s{font-size:10.5px;color:#71717a;margin-top:2px;line-height:1.4}
.fields{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;margin-top:4mm;color:#52525b;flex-wrap:wrap}
.fields i{display:inline-block;border-bottom:1px dotted #71717a;min-width:34mm;font-style:normal}
.mh,.ft{display:flex;justify-content:space-between;font-size:8pt;color:#8a8a93}.mh{border-bottom:1px solid #f0ebe3;padding-bottom:2mm}.ft{border-top:1px solid #f0ebe3;padding-top:2mm}
.body{flex:1 1 0;min-height:0;margin-top:3mm;column-gap:9mm;column-fill:auto;column-rule:1px solid #f0ebe3;overflow:hidden}
.q{break-inside:avoid;padding:2.6mm 0;border-bottom:1px solid #f6f1e8;display:flex;gap:7px;font-size:11.5px;line-height:1.45}
.n{flex:none;width:19px;height:19px;border-radius:50%;background:#18181b;color:#fff;font-size:9px;display:grid;place-items:center;font-weight:600;margin-top:1px}
.qt{white-space:pre-line;font-weight:500}.o{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:5px;font-size:11px;font-weight:400}
.ln{height:7mm;border-bottom:1px dotted #a1a1aa}.tag{font-size:8px;color:#a1a1aa;margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.q>div{flex:1;min-width:0}
