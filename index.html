<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutor Mohan – Worksheet Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:Poppins,system-ui,sans-serif}
body{margin:0;background:#fdfcfb;color:#18181b;font-size:14px}
.serif{font-family:'Instrument Serif',serif}
header{position:sticky;top:0;z-index:5;background:#fdfcfbee;border-bottom:1px solid #f0ebe3;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
header .serif{font-size:20px}.chip{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid #ece7de;background:#f4f0e8}
main{max-width:860px;margin:0 auto;padding:24px 16px 60px}
.card{background:#fff;border:1px solid #ece7de;border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 8px 30px #0000000a}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:34px;margin:0;text-align:center}
.sub{text-align:center;font-size:12px;color:#71717a;margin:6px 0 20px}
label.l{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#71717a;font-weight:500;margin:16px 0 6px}
select,input[type=text],input[type=number]{width:100%;padding:10px 12px;border:1px solid #ece7de;border-radius:12px;background:#fdfcfb;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:600px){.row,.row4{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}.chips input{display:none}
.chips span{display:inline-block;padding:6px 13px;border:1px solid #ece7de;border-radius:99px;font-size:12.5px;background:#fff}
.chips input:checked+span{background:#18181b;color:#fff;border-color:#18181b}
.grp{font-size:11px;color:#a1a1aa;margin:10px 0 4px}
.mini{font-size:11px;border:1px solid #ece7de;background:#fff;border-radius:99px;padding:4px 11px;cursor:pointer}
.mini:hover{background:#18181b;color:#fff}
.cnt{border-radius:14px;padding:10px;border:1px solid #ece7de;background:#fdfcfb}
.cnt b{font-size:11px;text-transform:uppercase;letter-spacing:.08em}.cnt small{display:block;color:#71717a;font-size:11px;margin-top:3px}
.e b{color:#15803d}.m b{color:#b45309}.d b{color:#b91c1c}
.status{margin-top:10px;font-size:12.5px;padding:8px 12px;border-radius:10px}
.ok{background:#ecfdf5;color:#065f46}.bad{background:#fef2f2;color:#991b1b}.warn{background:#fffbeb;color:#92400e}
.opts{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:12.5px}
.opts label{display:flex;gap:6px;align-items:center}.opts select{width:auto;padding:4px 8px}
.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#18181b;color:#fff;font-size:15px;font-weight:500;cursor:pointer}
.go:disabled{opacity:.35;cursor:not-allowed}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin:26px 0 14px}
.btn{padding:9px 16px;border-radius:99px;border:1px solid #ddd6c8;background:#fff;cursor:pointer;font-size:13px}.btn.p{background:#18181b;color:#fff;border-color:#18181b}
/* A4 sheets */
.sheet{width:210mm;height:297mm;background:#fff;border:1px solid #ece7de;box-shadow:0 10px 40px #00000012;margin:0 auto 24px;padding:11mm 13mm 8mm;display:flex;flex-direction:column;overflow:hidden;break-after:page}
.sheet .hd{text-align:center;border-bottom:1px solid #ece7de;padding-bottom:3mm}
.hd .t{font-family:'Instrument Serif',serif;font-size:22px}.hd .s{font-size:10.5px;color:#71717a;margin-top:2px}
.fields{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;margin-top:4mm;color:#52525b}
.fields i{display:inline-block;border-bottom:1px dotted #71717a;min-width:34mm;font-style:normal}
.mh,.ft{display:flex;justify-content:space-between;font-size:8pt;color:#8a8a93}.mh{border-bottom:1px solid #f0ebe3;padding-bottom:2mm}.ft{border-top:1px solid #f0ebe3;padding-top:2mm}
.body{flex:1 1 0;min-height:0;margin-top:3mm;column-gap:9mm;column-fill:auto;column-rule:1px solid #f0ebe3;overflow:hidden}
.q{break-inside:avoid;padding:2.6mm 0;border-bottom:1px solid #f6f1e8;display:flex;gap:7px;font-size:11.5px;line-height:1.45}
.n{flex:none;width:19px;height:19px;border-radius:50%;background:#18181b;color:#fff;font-size:9px;display:grid;place-items:center;font-weight:500;margin-top:1px}
.qt{white-space:pre-line;font-weight:500}.o{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:5px;font-size:11px;font-weight:400}
.ln{height:7mm;border-bottom:1px dotted #a1a1aa}.tag{font-size:8px;color:#a1a1aa;margin-top:3px}
.q>div{flex:1;min-width:0}.ak{font-size:11px;padding:1.6mm 0}
@media print{@page{size:A4;margin:0}body{background:#fff}.no-print{display:none!important}.pages{zoom:1!important}
.sheet{margin:0;border:0;box-shadow:none}body[data-print=ws] #keyPages,body[data-print=key] #wsPages{display:none}}
</style></head><body>
<header class="no-print"><span class="serif">Tutor Mohan <span style="font-size:12px;color:#71717a;font-family:Poppins">in collaboration with Mr Worksheet</span></span><span class="chip" id="src">Loading…</span></header>
<main>
<div class="no-print">
<h1>Worksheet Generator</h1><p class="sub">Pick the syllabus, set the difficulty mix, print an A4 worksheet with answer key.</p>
<div class="card">
 <label class="l" style="margin-top:0">1 · Subject &amp; Grade</label>
 <div class="row"><select id="subj"></select><select id="grade"></select></div>
 <label class="l">2 · Chapters <button class="mini" id="allCh">Select all</button></label><div class="chips" id="chs"><span class="sub" style="margin:0">Choose subject and grade first</span></div>
 <label class="l">3 · Topics <button class="mini" id="allTp">Select all</button></label><div id="tps"><span class="sub" style="margin:0">Select one or more chapters</span></div>
 <div id="step4" hidden>
  <label class="l">4 · Questions &amp; difficulty mix</label>
  <div class="row4">
   <div class="cnt"><b>Total</b><input type="number" id="tot" min="1" max="100" value="10"><small id="aT"></small></div>
   <div class="cnt e"><b>Easy</b><input type="number" id="ne" min="0" value="4"><small id="aE"></small></div>
   <div class="cnt m"><b>Moderate</b><input type="number" id="nm" min="0" value="4"><small id="aM"></small></div>
   <div class="cnt d"><b>Difficult</b><input type="number" id="nd" min="0" value="2"><small id="aD"></small></div>
  </div>
  <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><span style="font-size:12px;color:#71717a;align-self:center">Auto-split:</span>
   <button class="mini" data-p="40,40,20">Balanced 40/40/20</button><button class="mini" data-p="60,30,10">Easy-heavy</button><button class="mini" data-p="20,40,40">Challenge</button><button class="mini" data-p="34,33,33">Equal</button></div>
  <div class="status" id="st"></div>
  <label class="l">5 · Worksheet details</label>
  <div class="row"><input type="text" id="ttl" placeholder="Worksheet title (auto if blank)"><input type="text" id="cls" placeholder="Class / section (optional)"></div>
  <div class="row" style="margin-top:10px"><input type="text" id="sch" placeholder="School / institute (default: Tutor Mohan)"><input type="text" id="tch" placeholder="Teacher name (optional)"></div>
  <div class="opts">
   <label>Columns <select id="cols"><option value="2">2</option><option value="1">1</option></select></label>
   <label>Order <select id="ord"><option value="g">Easy → Difficult</option><option value="m">Mixed</option></select></label>
   <label><input type="checkbox" id="tags" checked> Difficulty tags</label>
   <label><input type="checkbox" id="key" checked> Answer key</label>
   <label><input type="checkbox" id="fill" checked> Fill shortage from other levels</label>
  </div>
  <button class="go" id="gen" disabled>Generate Worksheet</button>
 </div>
</div></div>
<div id="out" hidden>
 <div class="bar no-print"><div><div class="serif" style="font-size:24px">Worksheet Preview</div><div id="info" style="font-size:12px;color:#71717a"></div></div>
  <div style="display:flex;gap:8px"><button class="btn" id="re">Regenerate (new mix)</button><button class="btn p" id="pw">Print worksheet</button><button class="btn" id="pk">Print answer key</button></div></div>
 <div class="status warn no-print" id="wn" hidden></div>
 <div class="pages" id="wsPages"></div><div class="pages" id="keyPages"></div>
</div>
</main>
<script>
const CFG={indexSheetId:"1VxeTKAyHeIDlrjwbVJaOyZWkIj_G8BMTxohr-Rw0VnQ",indexSheetTab:"DriveIndex",branding:"Tutor Mohan in collaboration with Mr Worksheet"};
// Demo bank (used if the live Google Sheet index is unreachable). Format: "E|M|D | question | answer | opt1~opt2~opt3~opt4"
const DEMO=[
["Mathematics","Grade 4","Place Values","Rounding up",["E|Round 47 to the nearest 10.|50","E|Round 63 to the nearest 10.|60|60~70~63~65","M|Round 328 to the nearest 100.|300","M|Round 5,673 to the nearest 1000.|6000","D|A shop has 186 apples and 214 oranges. Estimate the total by rounding each to the nearest 10.|190 + 210 = 400","D|What is the greatest 3-digit number that rounds to 500 when rounded to the nearest 100?|549"]],
["Mathematics","Grade 4","Geometry","Angles",["E|How many degrees are in a right angle?|90°","E|An angle smaller than 90° is called:|Acute|Acute~Obtuse~Right~Straight","M|Classify 120°, 45°, 90° and 180° as acute, right, obtuse or straight.|Obtuse, acute, right, straight","M|How many right angles make a straight angle?|2","D|Two angles lie on a straight line. One is 65°. Find the other.|115°","D|Through what angle does the minute hand turn from 12 to 4?|120°"]],
["Mathematics","Grade 5","Fractions","Adding Fractions",["E|Add: 1/4 + 2/4 = ?|3/4","E|3/7 + 2/7 = ?|5/7|5/14~5/7~6/7~1/7","M|Add 2/5 + 1/5.|3/5","M|Add 1/3 + 1/6 in simplest form.|1/2","D|Rohan ate 1/3 of a pizza and Mohan ate 1/4. How much did they eat together?|7/12","D|Find 3/8 + 1/4 + 1/2.|9/8 = 1 1/8"]],
["Mathematics","Grade 5","Fractions","Equivalent Fractions",["E|Fill in the blank: 1/2 = ___/4|2","E|Which fraction is equivalent to 2/3?|4/6|3/4~4/6~2/5~5/6","M|Write two fractions equivalent to 3/5.|6/10, 9/15 (any two)","M|Is 4/6 equivalent to 6/9? Give a reason.|Yes, both simplify to 2/3","D|Find x: 5/8 = x/40.|25","D|Arrange from smallest to largest using equivalent fractions: 1/2, 3/8, 5/6.|3/8, 1/2, 5/6"]],
["Mathematics","Grade 5","Decimals","Place Value",["E|What is the place value of 7 in 3.47?|Hundredths","E|Which digit is in the tenths place in 5.82?|8|5~8~2~0","M|Write 6 + 4/10 + 3/100 as a decimal.|6.43","M|Write 12.305 in expanded form.|10 + 2 + 3/10 + 5/1000","D|Arrange in ascending order: 0.5, 0.45, 0.054, 0.405.|0.054, 0.405, 0.45, 0.5","D|How many times is the 9 in 90.2 worth the 9 in 40.092?|1000 times (90 ÷ 0.09)"]],
["Mathematics","Grade 6","Algebra","Simple Equations",["E|Solve: x + 5 = 12|x = 7","E|If y − 4 = 9, then y = ?|13|5~13~36~9","M|Solve: 2x + 3 = 15|x = 6","M|Solve: 5y − 7 = 18|y = 5","D|Seema thinks of a number, doubles it and adds 9 to get 31. Find the number.|11","D|Solve: 3(x − 2) = 2x + 5|x = 11"]],
["Science","Grade 5","Plants","Photosynthesis Basics",["E|Name the green pigment in leaves that traps sunlight.|Chlorophyll","E|Which gas do plants take in for photosynthesis?|Carbon dioxide|Oxygen~Carbon dioxide~Nitrogen~Hydrogen","M|List the raw materials needed for photosynthesis.|Sunlight, water, carbon dioxide (and chlorophyll)","M|Through which tiny openings in leaves does a plant take in carbon dioxide?|Stomata","D|Explain why a plant kept in a dark cupboard for many days turns pale and weak.|No light, so no photosynthesis; it cannot make food and chlorophyll fades","D|Write the word equation for photosynthesis.|Carbon dioxide + water → (sunlight, chlorophyll) glucose + oxygen"]],
["English","Grade 5","Grammar","Tenses - Present",["E|Fill in the blank: She ______ (play) football every day.|plays","E|Choose the correct sentence.|He goes to school.|He go to school.~He goes to school.~He going to school.~He gone to school.","M|Rewrite in present continuous: 'They sing a song.'|They are singing a song.","M|Fill in the blank: I ______ (read) a book right now.|am reading","D|Name the tense and rewrite in present perfect: 'Meena is cleaning her room.'|Present continuous; Meena has cleaned her room.","D|Fill in: My brother (not/like) spinach, but he (eat) it when Mum insists.|does not like; eats"]]
];
const DN={E:"Easy",M:"Moderate",D:"Difficult"},$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S={rows:[],ch:new Set,tp:new Set,pool:{E:[],M:[],D:[]},cache:{}};

// Difficulty normaliser: Easy/E/1 -> E ; Difficult/Hard/D/H/3 -> D ; everything else (Moderate/Medium/...) -> M
const norm=d=>{d=String(d==null?"":d).trim().toLowerCase();
 if(/^(e|1|l)/.test(d))return"E";            // easy, e, 1, low, level 1
 if(/^(d|h|3)/.test(d))return"D";            // difficult, hard, d, h, 3
 return"M"};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function demoQs(r){return r[4].map(s=>{const[d,t,a,o]=s.split("|");return{d:norm(d),text:t,ans:a,opts:o?o.split("~"):null,topic:r[3]}})}

// Parse Google Visualization JSON. If Google fails to detect the header row
// (all-text sheets), the labels come back empty -> use the first data row as header.
function gviz(txt){
 const j=JSON.parse(txt.slice(txt.indexOf("{"),txt.lastIndexOf("}")+1));if(!j.table)throw 0;
 let cols=j.table.cols.map(c=>(c.label||"").trim());
 let rows=j.table.rows.map(r=>(r.c||[]).map(c=>c?(c.v??c.f??""):""));
 if(cols.every(c=>!c)&&rows.length){cols=rows[0].map(v=>String(v).trim());rows=rows.slice(1)}
 return{cols,rows}}
const gi=(cols,names)=>{for(const n of names){const i=cols.findIndex(c=>c.toLowerCase().replace(/\s+/g,"").includes(n));if(i>-1)return i}return -1};
async function loadIndex(){
 try{const u=`https://docs.google.com/spreadsheets/d/${CFG.indexSheetId}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(CFG.indexSheetTab)}`;
  const r=await fetch(u);if(!r.ok)throw 0;const{cols,rows}=gviz(await r.text());
  const ix=[["subject"],["grade","class"],["chapter","unit"],["topic","lesson"],["fileid","id"]].map((n,k)=>{const i=gi(cols,n);return i<0?k:i});
  S.rows=rows.map(r=>({subject:String(r[ix[0]]??"").trim(),grade:String(r[ix[1]]??"").trim(),chapter:String(r[ix[2]]??"").trim(),topic:String(r[ix[3]]??"").trim(),id:String(r[ix[4]]??"").trim()})).filter(r=>r.subject&&r.topic&&r.id);
  if(!S.rows.length)throw 0;$("#src").textContent="Live Drive index ✓"}
 catch{S.rows=DEMO.map((r,i)=>({subject:r[0],grade:r[1],chapter:r[2],topic:r[3],id:"demo"+i,demo:r}));$("#src").textContent="Demo question bank"}
 S.rows.forEach((r,i)=>r.k=i);
}
async function loadQs(r){
 if(S.cache[r.id])return S.cache[r.id];let qs;
 if(r.demo)qs=demoQs(r.demo);
 else try{const x=await fetch(`https://docs.google.com/spreadsheets/d/${r.id}/gviz/tq?tqx=out:json&headers=1`);const{cols,rows}=gviz(await x.text());
  const I={d:gi(cols,["difficulty","level"]),t:gi(cols,["questiontext","question"]),a:gi(cols,["answer"]),sp:gi(cols,["answerspace","space","lines"]),o:["optiona","optionb","optionc","optiond"].map(n=>gi(cols,[n]))};
  // 'answer' must not match 'answerspace'
  if(I.a>-1&&I.a===I.sp){const j=cols.findIndex((c,i)=>/^answer$/i.test(c.trim())&&i!==I.sp);I.a=j}
  qs=rows.map(c=>{const text=String(c[I.t<0?4:I.t]??"").trim();if(!text)return null;
   let opts=I.o.every(i=>i>-1)?I.o.map(i=>String(c[i]??"").trim()).filter(Boolean):null;if(opts&&opts.length<2)opts=null;
   return{d:norm(c[I.d<0?2:I.d]),text,ans:I.a>-1&&c[I.a]!==""&&c[I.a]!=null?String(c[I.a]):"",opts,lines:I.sp>-1?parseInt(c[I.sp])||0:0,topic:r.topic}}).filter(Boolean)}
 catch{qs=[];S.err=(S.err||0)+1}
 return S.cache[r.id]=qs;
}
const sel=(el,vals,ph)=>{el.innerHTML=`<option value="">${ph}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join("")};
const uniq=a=>[...new Set(a)];
function fillSubj(){sel($("#subj"),uniq(S.rows.map(r=>r.subject)).sort(),"Select subject");fillGrade()}
function fillGrade(){const s=$("#subj").value;sel($("#grade"),uniq(S.rows.filter(r=>r.subject===s).map(r=>r.grade)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})),s?"Select grade":"Select subject first");fillCh()}
const scope=()=>S.rows.filter(r=>r.subject===$("#subj").value&&r.grade===$("#grade").value);
function chips(box,items,set,cb,grouped){box.innerHTML=items.map(([v,l,g])=>(g?`<div class="grp">${esc(g)}</div>`:"")+`<label><input type="checkbox" value="${esc(v)}" ${set.has(v)?"checked":""}><span>${esc(l)}</span></label>`).join("");
 box.querySelectorAll("input").forEach(i=>i.onchange=()=>{i.checked?set.add(i.value):set.delete(i.value);cb()})}
function fillCh(){S.ch.clear();S.tp.clear();const c=uniq(scope().map(r=>r.chapter)).sort();
 $("#chs").className="chips";chips($("#chs"),c.map(x=>[x,x]),S.ch,fillTp);if(!c.length)$("#chs").innerHTML='<span class="sub" style="margin:0">Choose subject and grade first</span>';fillTp()}
function fillTp(){for(const k of [...S.tp])if(!S.ch.has(S.rows[k].chapter))S.tp.delete(k);
 const box=$("#tps");box.innerHTML="";if(!S.ch.size){box.innerHTML='<span class="sub" style="margin:0">Select one or more chapters</span>'}
 else for(const ch of [...S.ch].sort()){const d=document.createElement("div");d.className="chips";box.appendChild(d);
  const rows=scope().filter(r=>r.chapter===ch);d.innerHTML=`<div class="grp" style="width:100%">${esc(ch)}</div>`;
  const t=document.createElement("div");t.className="chips";d.appendChild(t);chips(t,rows.map(r=>[String(r.k),r.topic]),new Set([...S.tp].map(String)),()=>{},0);
  t.querySelectorAll("input").forEach(i=>i.onchange=()=>{const k=+i.value;i.checked?S.tp.add(k):S.tp.delete(k);refreshPool()})}
 refreshPool()}
async function refreshPool(){
 $("#step4").hidden=!S.tp.size;S.pool={E:[],M:[],D:[]};if(!S.tp.size)return;
 const all=await Promise.all([...S.tp].map(k=>loadQs(S.rows[k])));const seen=new Set;
 all.flat().forEach(q=>{const key=q.text.toLowerCase();if(!seen.has(key)){seen.add(key);S.pool[q.d].push(q)}});
 const p=S.pool;$("#aE").textContent=p.E.length+" available";$("#aM").textContent=p.M.length+" available";$("#aD").textContent=p.D.length+" available";
 $("#aT").textContent=(p.E.length+p.M.length+p.D.length)+" available";check()}
const num=id=>Math.max(0,parseInt($(id).value)||0);
function check(){const t=num("#tot"),a=num("#ne")+num("#nm")+num("#nd"),st=$("#st"),p=S.pool,av=p.E.length+p.M.length+p.D.length;let m,c="ok",ok=true;
 if(!t){m="Enter total questions (at least 1).";c="bad";ok=false}
 else if(a<t){m=`Assigned ${a} of ${t} — add ${t-a} more across Easy / Moderate / Difficult.`;c="bad";ok=false}
 else if(a>t){m=`Assigned ${a} of ${t} — remove ${a-t}.`;c="bad";ok=false}
 else{m=`✓ ${a} of ${t} assigned.`;const sh=["E","M","D"].map((k,i)=>[DN[k],[num("#ne"),num("#nm"),num("#nd")][i]-p[k].length]).filter(x=>x[1]>0);
  if(t>av){m+=` Only ${av} questions exist for the selected topics — add more topics or reduce the total.`;c="warn"}
  else if(sh.length){m+=` Short on: ${sh.map(x=>x[0]+" (need "+x[1]+" more)").join(", ")}. `+($("#fill").checked?"Shortfall will be filled from other levels.":"Fewer questions will be generated.");c="warn"}}
 st.className="status "+c;st.textContent=m;$("#gen").disabled=!ok||!av}
function split(t,pc){const[e,m,d]=pc;let E=Math.round(t*e/100),D=Math.round(t*d/100);$("#tot").value=t;$("#ne").value=E;$("#nd").value=D;$("#nm").value=Math.max(0,t-E-D);check()}
function pick(){const p=S.pool,want={E:num("#ne"),M:num("#nm"),D:num("#nd")},used=new Set,res=[];let miss=0;
 const byTopic=a=>{const g={};shuf(a).forEach(q=>(g[q.topic]??=[]).push(q));const L=Object.values(g),o=[];for(let i=0;L.some(l=>i<l.length);i++)L.forEach(l=>l[i]&&o.push(l[i]));return o};
 for(const k of "EMD"){const got=byTopic(p[k]).slice(0,want[k]);got.forEach(q=>{used.add(q);res.push(q)});miss+=want[k]-got.length}
 let fill=0;if(miss&&$("#fill").checked){const rest=shuf(["E","M","D"].flatMap(k=>p[k]).filter(q=>!used.has(q))).slice(0,miss);rest.forEach(q=>res.push(q));fill=rest.length}
 const short=miss-fill;return{qs:$("#ord").value==="g"?res.sort((a,b)=>"EMD".indexOf(a.d)-"EMD".indexOf(b.d)):shuf(res),short,fill}}
let cur=[];
async function generate(){const{qs,short,fill}=pick();cur=qs;await render();
 const w=[];if(fill)w.push(`${fill} question(s) were filled from other difficulty levels.`);if(short)w.push(`${short} question(s) could not be generated — not enough questions in the bank.`);
 if(S.err)w.push("Some topic files could not be loaded from Drive.");const wn=$("#wn");wn.hidden=!w.length;wn.textContent=w.join(" ");
 $("#out").hidden=false;setTimeout(()=>$("#out").scrollIntoView({behavior:"smooth"}),50)}
function paginate(root,items,render,cols,first,brand,title){root.innerHTML="";let n=0,body;
 const mk=()=>{n++;const s=document.createElement("section");s.className="sheet";
  s.innerHTML=(n==1?first:`<div class="mh"><span>${esc(brand)} | ${esc(title)}</span><span>${root.id==="keyPages"?"Answer Key":"Worksheet"}</span></div>`)+'<div class="body"></div><div class="ft"><span>© '+new Date().getFullYear()+" "+esc(brand)+'</span><span class="pg"></span></div>';
  root.appendChild(s);body=s.querySelector(".body");body.style.columnCount=cols};
 mk();for(const it of items){const e=render(it);body.appendChild(e);if(body.scrollWidth>body.clientWidth+2&&body.children.length>1){body.removeChild(e);mk();body.appendChild(e)}}
