*{box-sizing:border-box}
body{margin:0}
.serif{font-family:'Instrument Serif', Georgia, serif}

.card{background:#fff;border:1px solid #ece7de;border-radius:20px;padding:22px;margin-bottom:14px;box-shadow:0 8px 30px #00000006}

.sub{font-size:12px;color:#71717a;text-align:center;margin:10px 0 18px;line-height:1.5}

select,input[type=text],input[type=number]{width:100%;padding:11px 14px;border:1px solid #ece7de;border-radius:12px;background:#fdfcfb;font-size:14px;outline:none;transition:.15s}

.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.mini:hover{background:#18181b;color:#fff;border-color:#18181b}

.chips{display:flex;flex-wrap:wrap;gap:7px}
