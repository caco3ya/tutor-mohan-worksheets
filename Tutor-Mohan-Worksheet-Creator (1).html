function scanDrive() {
  var ROOT_ID = 'YOUR_ROOT_FOLDER_ID'; // <-- PASTE YOUR DRIVE ROOT FOLDER ID HERE
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('DriveIndex');
  if (!sheet) sheet = ss.insertSheet('DriveIndex');
  sheet.clear();
  sheet.appendRow(['Subject','Grade','Chapter','Topic','TopicSheetId','FolderLink']);
  
  try {
    var root = DriveApp.getFolderById(ROOT_ID);
    var subjectIter = root.getFolders();
    var count = 0;
    while (subjectIter.hasNext()) {
      var subjectFolder = subjectIter.next();
      var subjectName = subjectFolder.getName();
      var gradeIter = subjectFolder.getFolders();
      
      // If no grade subfolders, check if subject folder directly contains chapter folders
      if (!gradeIter.hasNext()) {
        // Subject -> Chapter -> Topic sheets
        var chapterIterDirect = subjectFolder.getFolders();
        while (chapterIterDirect.hasNext()) {
          var chapFolderDirect = chapterIterDirect.next();
          var chapNameDirect = chapFolderDirect.getName();
          indexTopicsInChapter_(sheet, subjectName, 'General', chapNameDirect, chapFolderDirect);
        }
        continue;
      }
      
      while (gradeIter.hasNext()) {
        var gradeFolder = gradeIter.next();
        var gradeName = gradeFolder.getName();
        var chapterIter = gradeFolder.getFolders();
        
        // Grade folder may directly contain topic sheets (no chapter level)
        if (!chapterIter.hasNext()) {
          indexTopicsInChapter_(sheet, subjectName, gradeName, 'General', gradeFolder);
          continue;
        }
        
        while (chapterIter.hasNext()) {
          var chapterFolder = chapterIter.next();
          var chapterName = chapterFolder.getName();
          indexTopicsInChapter_(sheet, subjectName, gradeName, chapterName, chapterFolder);
        }
      }
    }
    SpreadsheetApp.getUi().alert('✅ Scan complete! Indexed ' + (sheet.getLastRow()-1) + ' topics.\\nNow your website will auto-show them.');
  } catch (e) {
    SpreadsheetApp.getUi().alert('Error: ' + e.message + '\\nCheck ROOT_ID and that Drive API is enabled.');
  }
}

function indexTopicsInChapter_(sheet, subject, grade, chapter, chapterFolder) {
  // Sheets directly in chapter folder
  var files = chapterFolder.getFilesByType(MimeType.GOOGLE_SHEETS);
  while (files.hasNext()) {
    var file = files.next();
    var topicName = file.getName();
    var topicId = file.getId();
    var link = 'https://docs.google.com/spreadsheets/d/' + topicId + '/edit';
    sheet.appendRow([subject, grade, chapter, topicName, topicId, link]);
  }
  // Subfolders inside chapter = topics with sheets inside
  var subFolders = chapterFolder.getFolders();
  while (subFolders.hasNext()) {
    var sub = subFolders.next();
    var subName = sub.getName();
    var subFiles = sub.getFilesByType(MimeType.GOOGLE_SHEETS);
    while (subFiles.hasNext()) {
      var sf = subFiles.next();
      sheet.appendRow([subject, grade, chapter, subName + ' - ' + sf.getName(), sf.getId(), 'https://docs.google.com/spreadsheets/d/' + sf.getId() + '/edit']);
    }
  }
}
